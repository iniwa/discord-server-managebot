<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Discord Server Manager</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <svg width="24" height="24" viewBox="0 0 71 55" fill="none" xmlns="http://www.w3.org/2000/svg">

      <defs><clipPath id="clip0"><rect width="71" height="55" fill="white"/></clipPath></defs>
    </svg>
    <h1>Discord Server Manager</h1>
  </header>

  <nav class="tabs">
    <button class="tab-btn active" data-tab="snapshots">ロールスナップショット</button>
    <button class="tab-btn" data-tab="reaction-roles">リアクションロール</button>
    <button class="tab-btn" data-tab="voice-roles">VCロール</button>
    <button class="tab-btn" data-tab="members">メンバー</button>
    <button class="tab-btn" data-tab="leave-log">退出ログ</button>
    <button class="tab-btn" data-tab="bot-log">BOTログ</button>
  </nav>

  <!-- Snapshots Tab -->
  <div class="tab-panel active" id="tab-snapshots">
    <div class="card">
      <div class="card-header">
        <h2>ロールスナップショット</h2>
        <div style="display:flex;gap:8px;align-items:center;">
          <input type="text" id="snapshot-note" placeholder="メモ (任意)" style="width:200px;" />
          <button class="btn btn-primary" onclick="takeSnapshot()">スナップショット取得</button>
        </div>
      </div>
      <div id="snapshots-list"></div>
    </div>
    <div class="card" id="snapshot-detail" style="display:none;">
      <div class="card-header">
        <h2 id="snapshot-detail-title">スナップショット詳細</h2>
        <button class="btn btn-ghost btn-sm" onclick="document.getElementById('snapshot-detail').style.display='none'">閉じる</button>
      </div>
      <div id="snapshot-entries"></div>
    </div>
  </div>

  <!-- Reaction Roles Tab -->
  <div class="tab-panel" id="tab-reaction-roles">
    <div class="card">
      <div class="card-header"><h2>リアクションロール追加</h2></div>
      <div class="form-row">
        <div class="form-group">
          <label>チャンネル</label>
          <select id="rr-channel"><option value="">-- チャンネル選択 --</option></select>
        </div>
        <div class="form-group">
          <label>メッセージID</label>
          <input type="text" id="rr-message" placeholder="メッセージID" />
        </div>
        <div class="form-group">
          <label>絵文字</label>
          <select id="rr-emoji-select" onchange="onEmojiSelectChange('rr')">
            <option value="">-- 絵文字を選択 --</option>
            <option value="__unicode__">📝 Unicode 絵文字を入力...</option>
          </select>
          <input type="text" id="rr-emoji-text" class="emoji-input-text" placeholder="😀" style="display:none;" />
        </div>
        <div class="form-group">
          <label>ロール</label>
          <select id="rr-role"><option value="">-- ロール選択 --</option></select>
        </div>
        <div class="form-group">
          <label>ラベル (任意)</label>
          <input type="text" id="rr-label" placeholder="説明" />
        </div>
        <button class="btn btn-primary" onclick="addReactionRole()" style="margin-bottom:0;">追加</button>
      </div>
    </div>
    <div class="card">
      <h2 style="margin-bottom:16px;">設定一覧</h2>
      <div id="reaction-roles-list"></div>
    </div>
  </div>

  <!-- Voice Roles Tab -->
  <div class="tab-panel" id="tab-voice-roles">
    <div class="card">
      <div class="card-header"><h2>VCロール追加</h2></div>
      <div class="form-row">
        <div class="form-group">
          <label>ボイスチャンネル</label>
          <select id="vr-channel"><option value="">-- チャンネル選択 --</option></select>
        </div>
        <div class="form-group">
          <label>付与するロール</label>
          <select id="vr-role"><option value="">-- ロール選択 --</option></select>
        </div>
        <div class="form-group">
          <label>ラベル (任意)</label>
          <input type="text" id="vr-label" placeholder="説明" />
        </div>
        <button class="btn btn-primary" onclick="addVoiceRole()" style="margin-bottom:0;">追加</button>
      </div>
    </div>
    <div class="card">
      <h2 style="margin-bottom:16px;">設定一覧</h2>
      <div id="voice-roles-list"></div>
    </div>
  </div>

  <!-- Members Tab -->
  <div class="tab-panel" id="tab-members">
    <div class="card">
      <div class="card-header">
        <h2>メンバー一覧</h2>
        <button class="btn btn-ghost btn-sm" id="members-refresh-btn" onclick="refreshMembersCache()">強制更新</button>
      </div>
      <div class="filter-row" style="flex-wrap:wrap;gap:10px;margin-bottom:16px;">
        <div class="form-group" style="min-width:200px;max-width:260px;">
          <label>フィルタ種別</label>
          <select id="member-filter-type" onchange="onFilterTypeChange()">
            <option value="">-- フィルタなし --</option>
            <option value="with">このロールを持つ</option>
            <option value="without">このロールを持たない</option>
          </select>
        </div>
        <div class="form-group" id="member-filter-role-group" style="min-width:200px;max-width:260px;display:none;">
          <label>ロール</label>
          <select id="member-filter-role"><option value="">-- ロール選択 --</option></select>
        </div>
        <div style="display:flex;align-items:flex-end;">
          <button class="btn btn-ghost" onclick="loadMembers()">検索</button>
        </div>
      </div>
      <div id="members-list"></div>
    </div>
  </div>

  <!-- Leave Log Tab -->
  <div class="tab-panel" id="tab-leave-log">
    <div class="card">
      <div class="card-header">
        <h2>退出ログ</h2>
        <span id="leave-log-total" class="badge"></span>
      </div>
      <div id="leave-log-list"></div>
      <div class="pagination" id="leave-log-pagination"></div>
    </div>
  </div>

  <!-- BOT Log Tab -->
  <div class="tab-panel" id="tab-bot-log">
    <div class="card">
      <div class="card-header">
        <h2>BOTログ</h2>
        <span id="bot-log-total" class="badge"></span>
      </div>
      <div id="bot-log-list"></div>
      <div class="pagination" id="bot-log-pagination"></div>
    </div>
  </div>

  <!-- ── Edit Modal ──────────────────────────────────────────────────────── -->
  <div class="modal-overlay hidden" id="modal-overlay" onclick="onOverlayClick(event)">
    <div class="modal">
      <div class="modal-header">
        <h2 id="modal-title">編集</h2>
        <button class="btn btn-ghost btn-sm" onclick="closeModal()">✕</button>
      </div>
      <div class="modal-body">

        <!-- Reaction Role edit fields -->
        <div id="modal-rr-fields">
          <div class="form-group" style="margin-bottom:10px;">
            <label>チャンネル</label>
            <select id="modal-rr-channel"><option value="">-- チャンネル選択 --</option></select>
          </div>
          <div class="form-group" style="margin-bottom:10px;">
            <label>メッセージID</label>
            <input type="text" id="modal-rr-message" placeholder="メッセージID" />
          </div>
          <div class="form-group" style="margin-bottom:10px;">
            <label>絵文字</label>
            <select id="modal-rr-emoji-select" onchange="onEmojiSelectChange('modal-rr')">
              <option value="">-- 絵文字を選択 --</option>
              <option value="__unicode__">📝 Unicode 絵文字を入力...</option>
            </select>
            <input type="text" id="modal-rr-emoji-text" class="emoji-input-text" placeholder="😀" style="display:none;" />
          </div>
          <div class="form-group" style="margin-bottom:10px;">
            <label>ロール</label>
            <select id="modal-rr-role"><option value="">-- ロール選択 --</option></select>
          </div>
          <div class="form-group">
            <label>ラベル (任意)</label>
            <input type="text" id="modal-rr-label" placeholder="説明" />
          </div>
        </div>

        <!-- Voice Role edit fields -->
        <div id="modal-vr-fields" style="display:none;">
          <div class="form-group" style="margin-bottom:10px;">
            <label>ボイスチャンネル</label>
            <select id="modal-vr-channel"><option value="">-- チャンネル選択 --</option></select>
          </div>
          <div class="form-group" style="margin-bottom:10px;">
            <label>付与するロール</label>
            <select id="modal-vr-role"><option value="">-- ロール選択 --</option></select>
          </div>
          <div class="form-group">
            <label>ラベル (任意)</label>
            <input type="text" id="modal-vr-label" placeholder="説明" />
          </div>
        </div>

      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" onclick="closeModal()">キャンセル</button>
        <button class="btn btn-primary" id="modal-save-btn" onclick="saveEdit()">保存</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
